spring.application.name=Projecte1

#=================== JPA ===============
spring.datasource.url=jdbc:mysql://localhost:3306/Projecte1?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
#spring.jpa.hibernate.ddl-auto=create
spring.jpa.hibernate.ddl-auto=update

# Configuraci\u00f3 HTTPS / SSL
server.ssl.key-store=classpath:keystore.p12
server.ssl.key-store-password=admin12
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=springboot

# Opcional: Canviar el port a 8443 per a HTTPS local
server.port=8443

# Par\u00e0metre de sistema: dies d'antelaci\u00f3 per a devoluci\u00f3 total (ex: 2 dies)
app.reserves.dies-antelacio-devolucio=2

# Configuraci\u00f3 d'enviament de correu (Spring Mail)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# =================== PUJADA DE FITXERS ===============
# Mida m\u00c3\u00a0xima de les imatges del registre (DNI i llic\u00c3\u00a8ncia)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB


# =================== LOGS (RN04) ===============
logging.file.name=logs/projecte1.log
logging.level.root=INFO
logging.level.cat.copernic.Projecte1=INFO
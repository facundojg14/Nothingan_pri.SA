<!DOCTYPE html>
<html lang="ca" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Formulari Vehicle - Nothingan Pri</title>
        <link rel="stylesheet" th:href="@{/css/styles.css}">
    </head>
    <body>

        <div class="layout">

            <!-- BARRA LATERAL DE NAVEGACIÓN -->
            <aside th:replace="~{fragments/layout :: menu('vehicles')}"></aside>

            <!-- CONTENIDO PRINCIPAL -->
            <main class="content">

                <!-- Capçalera superior per a Agents (Perfil i Logout) -->
                <header th:replace="~{fragments/layout :: capcalera('Gestió de vehicles')}"></header>

                <div class="top-bar">
                    <h3>Formulari Vehicle</h3>

                    <a th:href="@{__${session.rutaBase}__/vehicles/all}"
                       class="btn btn-cancel">
                        Tornar al llistat
                    </a>
                </div>

                <!-- ALERTA DE ERROR DE VALIDACIÓN O DUPLICIDAD -->
                <div th:if="${error}" class="alert-error" th:text="${error}"></div>

                <!-- FORMULARIO DE EDICIÓN Y CREACIÓN -->
                <div class="table-card" style="padding: 24px;">

                    <form th:action="@{__${session.rutaBase}__/vehicles/save}"
                          th:object="${vehicle}"
                          method="post">

                        <input type="hidden" th:field="*{id}" />

                        <div class="form-grid">

                            <!-- Campo: Matrícula -->
                            <div class="form-group">
                                <label for="matricula">Matrícula <span style="color: red;">*</span></label>
                                <input type="text"
                                       id="matricula"
                                       th:field="*{matricula}"
                                       maxlength="15"
                                       required>
                            </div>

                            <!-- Campo: Marca -->
                            <div class="form-group">
                                <label for="marca">Marca <span style="color: red;">*</span></label>
                                <input type="text"
                                       id="marca"
                                       th:field="*{marca}"
                                       maxlength="50"
                                       required>
                            </div>

                            <!-- Campo: Modelo -->
                            <div class="form-group">
                                <label for="model">Model <span style="color: red;">*</span></label>
                                <input type="text"
                                       id="model"
                                       th:field="*{model}"
                                       maxlength="50"
                                       required>
                            </div>

                            <!-- Campo: Año de Fabricación -->
                            <div class="form-group">
                                <label for="anyFabricacio">Any de Fabricació <span style="color: red;">*</span></label>
                                <input type="number"
                                       id="anyFabricacio"
                                       th:field="*{anyFabricacio}"
                                       min="1900"
                                       max="2099"
                                       required>
                            </div>

                            <!-- Desplegable Categoria -->
                            <div class="form-group">
                                <label for="categoria">Categoria <span style="color: red;">*</span></label>
                                <select id="categoria" th:field="*{categoria}" required>
                                    <option value="" selected disabled>Selecciona una categoria...</option>
                                    <option th:each="cat : ${T(cat.copernic.Projecte1.entity.Enum.Categoria).values()}" 
                                            th:value="${cat}" 
                                            th:text="${cat}">SUV</option>
                                </select>
                            </div>

                            <!-- Campo: Precio por Día -->
                            <div class="form-group">
                                <label for="preuDia">Preu per Dia (€) <span style="color: red;">*</span></label>
                                <input type="number"
                                       id="preuDia"
                                       th:field="*{preuDia}"
                                       step="0.01"
                                       min="0"
                                       max="999.99"
                                       required>
                            </div>

                            <!-- Campo: Precio por Hora (autocalculat preuDia / 24) -->
                            <div class="form-group">
                                <label for="preuHora">Preu per Hora (€) <span style="color: red;">*</span></label>
                                <input type="number"
                                       id="preuHora"
                                       th:field="*{preuHora}"
                                       step="0.01"
                                       min="0"
                                       max="999.99"
                                       required>
                            </div>

                            <!-- Campo: Fianza Estándar -->
                            <div class="form-group">
                                <label for="fiancaEstandar">Fiança Estàndard (€) <span style="color: red;">*</span></label>
                                <input type="number"
                                       id="fiancaEstandar"
                                       th:field="*{fiancaEstandar}"
                                       step="0.01"
                                       min="0"
                                       max="9999.99"
                                       required>
                            </div>

                            <!-- Desplegable Estado del Vehículo -->
                            <div class="form-group">
                                <label for="estatVehicle">Estat del Vehicle <span style="color: red;">*</span></label>

                                <!-- CASO 1: Creando vehículo nuevo (id == 0) -> Bloqueado en Disponible -->
                                <th:block th:if="${vehicle.id == 0}">
                                    <select id="estatVehicle" disabled>
                                        <option value="Disponible" selected>Disponible</option>
                                    </select>
                                    <input type="hidden" name="estatVehicle" value="Disponible" />
                                </th:block>

                                <!-- CASO 2: Editando vehículo existente (id > 0) -> Excluye 'Baixa' y 'Lliurat' manuales -->
                                <select th:if="${vehicle.id > 0}" id="estatVehicle" th:field="*{estatVehicle}" required>
                                    <option th:each="estat : ${T(cat.copernic.Projecte1.entity.Enum.EstatVehicle).values()}" 
                                            th:if="${(estat.name() != 'Baixa' and estat.name() != 'Lliurat') or (vehicle.estatVehicle != null and vehicle.estatVehicle.name() == estat.name())}"
                                            th:value="${estat}" 
                                            th:text="${estat}">Disponible</option>
                                </select>
                            </div>

                        </div>

                        <!-- Botón único de Submit fuera del grid -->
                        <div class="button-group" style="margin-top: 24px;">
                            <button type="submit" class="btn btn-filter" th:text="${vehicle.id == 0} ? 'Crear vehicle' : 'Desar vehicle'">
                                Crear vehicle
                            </button>

                           
                        </div>

                    </form>

                </div>

            </main>
        </div>

        <script>
            document.getElementById('preuDia').addEventListener('input', function () {
                const preuDia = parseFloat(this.value);
                const preuHoraInput = document.getElementById('preuHora');
                if (!isNaN(preuDia) && preuDia >= 0) {
                    preuHoraInput.value = (preuDia / 24).toFixed(2);
                } else {
                    preuHoraInput.value = '0.00';
                }
            });
        </script>

    </body>
</html>

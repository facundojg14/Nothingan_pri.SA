<!DOCTYPE html>
<html lang="ca" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Gestió de vehicles - Nothingan Pri</title>
        <link rel="stylesheet" th:href="@{/css/styles.css}">
    </head>
    <body>

        <div class="layout">

            <!-- BARRA LATERAL DE NAVEGACIÓN -->
            <aside class="sidebar">
                <div class="logo-container">
                    <a th:href="@{/web/usuaris/login}">
                        <img th:src="@{/img/logo.png}" alt="Nothingan Pri" class="logo">
                    </a>
                </div>

                <nav class="nav-menu">
                    <a th:href="@{/web/reserves/all}">• Reserves</a>
                    <a th:href="@{/web/vehicles/all}" class="active">• Vehicles</a>
                    <a th:href="@{/web/usuaris/all}">• Clients</a>
                </nav>
            </aside>

            <!-- CONTENIDO PRINCIPAL -->
            <main class="content">

                <!-- CABECERA SUPERIOR -->
                <header class="top-header">
                    <h2>Gestió de vehicles</h2>

                    <div class="user-dropdown">
                        <span>(agent) ▾</span>
                        <div class="user-avatar"></div>
                    </div>
                </header>

                <!-- MENSAJES DE ÉXITO Y ERROR DE ALERTA FLASH -->
                <div th:if="${missatge}" class="alert-success" th:text="${missatge}"></div>
                <div th:if="${error}" class="alert-error" th:text="${error}"></div>

                <!-- BARRA SUPERIOR CON TÍTULO Y BOTÓN DE CREAR -->
                <div class="top-bar">
                    <h3>Llistat de vehicles</h3>

                    <a th:href="@{/web/vehicles/new}" class="btn btn-add">
                        + Nou vehicle
                    </a>
                </div>

                <!-- FORMULARIO DE FILTROS COMBINADOS -->
                <div class="table-card" style="padding: 20px; margin-bottom: 20px;">
                    <form th:action="@{/web/vehicles/all}" method="get">
                        <div class="form-grid">

                            <!-- Filtro 1: Matrícula -->
                            <div class="form-group">
                                <label for="matricula">Matrícula del vehicle</label>
                                <input type="text"
                                       id="matricula"
                                       name="matricula"
                                       placeholder="Introdueix la matrícula"
                                       th:value="${matricula}">
                            </div>

                            <!-- Filtro 2: Marca -->
                            <div class="form-group">
                                <label for="marca">Marca del vehicle</label>
                                <input type="text"
                                       id="marca"
                                       name="marca"
                                       placeholder="Introdueix la marca"
                                       th:value="${marca}">
                            </div>

                            <!-- Filtro 3: Modelo -->
                            <div class="form-group">
                                <label for="model">Model del vehicle</label>
                                <input type="text" id="model" name="model" placeholder="Introdueix el model" th:value="${modelParam}">
                            </div>

                            <!-- Filtro 4: Año de Fabricación -->
                            <div class="form-group">
                                <label for="anyFabricacio">Any de Fabricació</label>
                                <input type="number" 
                                       id="anyFabricacio" 
                                       name="anyFabricacio" 
                                       placeholder="Ex: 2022" 
                                       min="1900" 
                                       max="2099"
                                       th:value="${anyFabricacio}">
                            </div>

                            <!-- Filtro 5: Desplegable por Categoría -->
                            <div class="form-group">
                                <label for="categoria">Categoria</label>
                                <select id="categoria" name="categoria">
                                    <option value="">-- Totes les categories --</option>
                                    <option th:each="cat : ${T(cat.copernic.Projecte1.entity.Enum.Categoria).values()}" 
                                            th:value="${cat.name()}" 
                                            th:text="${cat}"
                                            th:selected="${categoriaSel != null and cat == categoriaSel}">SUV</option>
                                </select>
                            </div>

                            <!-- Filtro 6: Fecha/Hora Inicio -->
                            <div class="form-group">
                                <label for="dataInici">Disponible des de</label>
                                <input type="datetime-local" 
                                       id="dataInici" 
                                       name="dataInici" 
                                       th:value="${dataInici}">
                            </div>

                            <!-- Filtro 7: Fecha/Hora Fin -->
                            <div class="form-group">
                                <label for="dataFi">Disponible fins a</label>
                                <input type="datetime-local" 
                                       id="dataFi" 
                                       name="dataFi" 
                                       th:value="${dataFi}">
                            </div>

                        </div>

                        <!-- Botones de acción del filtro -->
                        <div class="button-group" style="margin-top: 15px;">
                            <button type="submit" class="btn btn-filter">Filtrar</button>
                            <a th:href="@{/web/vehicles/all}" class="btn btn-cancel">Netejar filtres</a>
                        </div>
                    </form>
                </div>

                <!-- TABLA DE VEHÍCULOS RESULTANTES -->
                <div class="table-card">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Matrícula</th>
                                <th>Marca / Model</th>
                                <th>Categoria</th>
                                <th>Any</th>
                                <th>Preu / Dia</th>
                                <th>Estat</th>
                                <th>Actiu</th>
                                <th>Accions</th>
                            </tr>
                        </thead>

                        <tbody>
                            <tr th:each="v : ${vehicle}">
                                <td th:text="${v.matricula}">1234ABC</td>
                                <td th:text="${v.marca + ' ' + v.model}">Seat Ibiza</td>

                                <td>
                                    <span class="badge" 
                                          th:if="${v.categoria != null}" 
                                          th:text="${v.categoria.name()}">SUV</span>
                                    <span th:if="${v.categoria == null}">-</span>
                                </td>

                                <td th:text="${v.anyFabricacio}">2022</td>
                                <td th:text="${#numbers.formatDecimal(v.preuDia, 1, 2) + ' €'}">45.00 €</td>

                                <td>
                                    <span class="badge"
                                          th:classappend="${v.estatVehicle != null and v.estatVehicle.name() == 'Disponible'} ? ' badge-validat' : ' badge-baixa'"
                                          th:text="${v.estatVehicle}">Disponible</span>
                                </td>

                                <td>
                                    <span th:if="${v.actiu}" class="badge badge-validat">Sí</span>
                                    <span th:unless="${v.actiu}" class="badge badge-rebutjat">No</span>
                                </td>
                                <td class="actions-cell">
                                    <a th:href="@{/web/vehicles/edit/{id}(id=${v.id})}">Editar</a>
                                    <a th:href="@{/web/vehicles/delete/{id}(id=${v.id})}"
                                       class="action-link"
                                       style="color: var(--danger-color, #d9534f);"
                                       onclick="return confirm('Estàs segur que vols donar de baixa aquest vehicle?');">
                                        Baixa
                                    </a>
                                </td>
                            </tr>

                            <tr th:if="${#lists.isEmpty(vehicle)}">
                                <td colspan="8" class="empty-state">
                                    No s'han trobat vehicles registrats.
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

            </main>
        </div>

    </body>
</html>

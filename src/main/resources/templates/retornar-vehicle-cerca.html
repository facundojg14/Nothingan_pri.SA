<!DOCTYPE html>
<html lang="ca" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Retornar Vehicle - Nothingan Pri</title>
        <link rel="stylesheet" th:href="@{/css/styles.css}">
    </head>
    <body>

        <div class="layout">

            <!-- Menú lateral comú (fragments/layout.html) -->
            <aside th:replace="~{fragments/layout :: menu('retornar')}"></aside>

            <main class="content">

                <header th:replace="~{fragments/layout :: capcalera('Devolució de vehicles')}"></header>

                <div th:if="${missatge}" class="alert-success" th:text="${missatge}"></div>
                <div th:if="${error}" class="alert-error" th:text="${error}"></div>

                <div class="top-bar">
                    <h3>Cerca la reserva per retornar</h3>
                    <a th:href="@{__${session.rutaBase}__/reserves/all}" class="btn btn-cancel">Tornar a reserves</a>
                </div>

                <div class="table-card" style="padding: 20px; margin-bottom: 20px;">
                    <form th:action="@{__${session.rutaBase}__/reserves/retornar}" method="get">

                        <div class="form-grid">
                            <div class="form-group">
                                <label for="codi">Codi Reserva</label>
                                <input type="text" id="codi" name="codi" placeholder="Ex: RES-1234ABCD" th:value="${codi}">
                            </div>

                            <div class="form-group">
                                <label for="dni">DNI Client</label>
                                <input type="text" id="dni" name="dni" placeholder="Introdueix el DNI" th:value="${dni}">
                            </div>

                            <div class="form-group">
                                <label for="email">Email Client</label>
                                <input type="text" id="email" name="email" placeholder="Introdueix l'email" th:value="${email}">
                            </div>

                            <div class="form-group">
                                <label for="matricula">Matrícula Vehicle</label>
                                <input type="text" id="matricula" name="matricula" placeholder="Ex: 1234ABC" th:value="${matricula}">
                            </div>

                            <div class="form-group">
                                <label for="dataInici">Data d'inici</label>
                                <input type="date" id="dataInici" name="dataInici" th:value="${dataInici}">
                            </div>
                        </div>

                        <div class="button-group" style="margin-top: 15px;">
                            <button type="submit" class="btn btn-filter">Cercar reserva</button>
                            <a th:href="@{__${session.rutaBase}__/reserves/retornar}" class="btn btn-cancel">Netejar filtres</a>
                        </div>

                    </form>
                </div>

                <div class="table-card">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Codi</th>
                                <th>Client (DNI)</th>
                                <th>Vehicle</th>
                                <th>Inici</th>
                                <th>Fi</th>
                                <th>Estat</th>
                                <th>Acció</th>
                            </tr>
                        </thead>

                        <tbody>
                            <tr th:each="r : ${reserves}">
                                <td th:text="${r.codiReserva}">RES-001</td>
                                <td th:text="${r.usuari != null ? r.usuari.nom + ' (' + r.usuari.dni + ')' : '-'}">Client</td>
                                <td th:text="${r.vehicle != null ? r.vehicle.marca + ' ' + r.vehicle.model + ' - ' + r.vehicle.matricula : '-'}">Vehicle</td>
                                <td th:text="${#temporals.format(r.dataInici, 'dd/MM/yyyy HH:mm')}">12/11/2026</td>
                                <td th:text="${#temporals.format(r.dataFi, 'dd/MM/yyyy HH:mm')}">15/11/2026</td>
                                <td>
                                    <span class="badge badge-validat" th:text="${r.estat}">Lliurada</span>
                                </td>
                                <td class="actions-cell">
                                    <a th:href="@{__${session.rutaBase}__/reserves/retornar/{id}(id=${r.id})}" class="btn btn-add" style="padding: 6px 12px; font-size: 0.85rem;">
                                        Seleccionar i retornar
                                    </a>
                                </td>
                            </tr>

                            <tr th:if="${#lists.isEmpty(reserves)}">
                                <td colspan="7" class="empty-state">
                                    No s'han trobat reserves lliurades pendents de devolució amb aquests filtres.
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

            </main>
        </div>

    </body>
</html>

<!DOCTYPE html>
<html lang="ca" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Formulari Vehicle (Admin) - Nothingan Pri</title>
        <link rel="stylesheet" th:href="@{/css/styles.css}">
    </head>
    <body>

        <div class="layout">

            <!-- Menú Lateral Administrador -->
            <aside class="sidebar">
                <div class="logo-container">
                    <a th:href="@{/web/usuaris/login}">
                        <img th:src="@{/img/logo.png}" alt="Nothingan Pri" class="logo">
                    </a>
                </div>

                <nav class="nav-menu">
                    <a th:href="@{/web/admin/usuaris}">• Clients</a>
                    <a th:href="@{/web/admin/vehicles}" class="active">• Vehicles</a>
                    <a th:href="@{/web/admin/reserves}">• Reserves</a>
                    <a th:href="@{/web/admin/informes}">• Informes</a>
                    <a th:href="@{/web/admin/agents}">• Agents</a>
                </nav>
            </aside>

            <!-- Contingut Principal -->
            <main class="content">

                <!-- Capçalera superior -->
                <header class="top-header">
                    <h2>Gestió de clients</h2>

                    <div class="user-dropdown" style="display: flex; align-items: center; gap: 15px;">
                        <!-- Enllaç directament al Perfil amb el nom de l'usuari -->
                        <a th:href="@{/web/admin/perfil}" style="text-decoration: none; color: inherit; font-weight: 500;">
                            <span th:text="${session.usuariLoguejat != null ? session.usuariLoguejat.nom : 'El meu perfil'}">El meu perfil</span>
                        </a>

                        <!-- Botó directament per Tancar Sessió -->
                        <a th:href="@{/web/usuaris/logout}" class="btn btn-cancel" style="padding: 6px 12px; font-size: 0.85rem; text-decoration: none;">
                            Tancar Sessió
                        </a>
                    </div>
                </header>

                <div class="top-bar">
                    <h3>Formulari Vehicle</h3>

                    <!-- Enllaç de retorn al llistat d'Admin -->
                    <a th:href="@{/web/admin/vehicles}" class="btn btn-cancel">
                        Tornar al llistat
                    </a>
                </div>

                <div th:if="${error}" class="alert-error" th:text="${error}"></div>

                <div class="table-card" style="padding: 24px;">

                    <form th:action="@{/web/admin/vehicles/save}" th:object="${vehicle}" method="post">

                        <!-- Camp ocult per a l'ID -->
                        <input type="hidden" th:field="*{id}" />

                        <div class="form-grid">

                            <div class="form-group">
                                <label for="matricula">Matrícula <span style="color: red;">*</span></label>
                                <input type="text"
                                       id="matricula"
                                       th:field="*{matricula}"
                                       maxlength="15"
                                       required>
                            </div>

                            <div class="form-group">
                                <label for="marca">Marca <span style="color: red;">*</span></label>
                                <input type="text"
                                       id="marca"
                                       th:field="*{marca}"
                                       maxlength="50"
                                       required>
                            </div>

                            <div class="form-group">
                                <label for="model">Model <span style="color: red;">*</span></label>
                                <input type="text"
                                       id="model"
                                       th:field="*{model}"
                                       maxlength="50"
                                       required>
                            </div>

                            <div class="form-group">
                                <label for="anyFabricacio">Any de Fabricació <span style="color: red;">*</span></label>
                                <input type="number"
                                       id="anyFabricacio"
                                       th:field="*{anyFabricacio}"
                                       min="1900"
                                       max="2099"
                                       required>
                            </div>

                            <div class="form-group">
                                <label for="categoria">Categoria <span style="color: red;">*</span></label>
                                <select id="categoria" th:field="*{categoria}" required>
                                    <option value="" selected disabled>Selecciona una categoria...</option>
                                    <option th:each="cat : ${T(cat.copernic.Projecte1.entity.Enum.Categoria).values()}" 
                                            th:value="${cat}" 
                                            th:text="${cat}">SUV</option>
                                </select>
                            </div>

                            <div class="form-group">
                                <label for="preuDia">Preu per Dia (€) <span style="color: red;">*</span></label>
                                <input type="number"
                                       id="preuDia"
                                       th:field="*{preuDia}"
                                       step="0.01"
                                       min="0"
                                       max="999.99"
                                       required>
                            </div>

                            <div class="form-group">
                                <label for="estatVehicle">Estat del Vehicle <span style="color: red;">*</span></label>
                                <select id="estatVehicle" th:field="*{estatVehicle}" required>
                                    <option th:each="estat : ${T(cat.copernic.Projecte1.entity.Enum.EstatVehicle).values()}" 
                                            th:value="${estat}" 
                                            th:text="${estat}">Disponible</option>
                                </select>
                            </div>

                            <!-- Opcional: Sense asterisc -->
                            <div class="form-group">
                                <label for="fotoVehicle">Ruta / Nom de la Foto</label>
                                <input type="text"
                                       id="fotoVehicle"
                                       th:field="*{fotoVehicle}"
                                       maxlength="255"
                                       placeholder="ej: cotxe1.jpg">
                            </div>

                            <div class="form-group" style="grid-column: span 2;">
                                <label for="actiu" style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                                    <input type="checkbox"
                                           id="actiu"
                                           th:field="*{actiu}"
                                           style="width: auto;">
                                    <strong>Vehicle Actiu</strong>
                                </label>
                            </div>

                        </div>

                        <div class="button-group" style="margin-top: 24px;">
                            <button type="submit" class="btn btn-filter">
                                Desar vehicle
                            </button>

                            <a th:href="@{/web/admin/vehicles}" class="btn btn-cancel">
                                Cancel·lar
                            </a>
                        </div>

                    </form>

                </div>

            </main>
        </div>

    </body>
</html>

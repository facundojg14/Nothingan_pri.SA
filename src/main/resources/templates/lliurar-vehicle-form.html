<!DOCTYPE html>
<html lang="ca" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Confirmar Lliurament - Nothingan Pri</title>
        <link rel="stylesheet" th:href="@{/css/styles.css}">
    </head>
    <body>

        <div class="layout">

            <!-- BARRA LATERAL DE NAVEGACIÓN -->
            <!-- Menú lateral comú (fragments/layout.html) -->
            <aside th:replace="~{fragments/layout :: menu('lliurar')}"></aside>

            <!-- CONTENIDO PRINCIPAL -->
            <main class="content">

                <header th:replace="~{fragments/layout :: capcalera('Lliurament de vehicles')}"></header>

                <div class="top-bar">
                    <h3 th:text="'Confirmar lliurament - Reserva ' + ${reserva.codiReserva}">Confirmar lliurament</h3>
                    <a th:href="@{__${session.rutaBase}__/reserves/lliurar}" class="btn btn-cancel">Tornar a la cerca</a>
                </div>

                <div th:if="${error}" class="alert-error" th:text="${error}"></div>

                <!-- RESUMEN DE LA RESERVA SELECCIONADA -->
                <div class="table-card" style="padding: 20px; margin-bottom: 20px; background-color: #f9fafb;">
                    <h4 style="margin-top: 0; margin-bottom: 12px;">Dades de la Reserva</h4>
                    <div class="form-grid">
                        <div>
                            <strong>Client:</strong>
                            <span th:text="${reserva.usuari.nom + ' (' + reserva.usuari.dni + ')'}">Nom Client</span>
                        </div>
                        <div>
                            <strong>Vehicle:</strong>
                            <span th:text="${reserva.vehicle.marca + ' ' + reserva.vehicle.model + ' - ' + reserva.vehicle.matricula}">Vehicle</span>
                        </div>
                        <div>
                            <strong>Inici previst:</strong>
                            <span th:text="${#temporals.format(reserva.dataInici, 'dd/MM/yyyy HH:mm')}">12/11/2026 10:00</span>
                        </div>
                        <div>
                            <strong>Fi prevista:</strong>
                            <span th:text="${#temporals.format(reserva.dataFi, 'dd/MM/yyyy HH:mm')}">15/11/2026 10:00</span>
                        </div>
                    </div>
                </div>

                <!-- FORMULARIO DE ENTREGA Y VERIFICACIÓN -->
                <div class="table-card" style="padding: 24px;">
                    <form th:action="@{__${session.rutaBase}__/reserves/lliurar/{id}(id=${reserva.id})}"
                          method="post"
                          enctype="multipart/form-data">

                        <div class="form-grid">

                            <!-- Fecha y hora de entrega -->
                            <div class="form-group">
                                <label for="dataHoraLliurament">Data i hora de lliurament <span style="color: red;">*</span></label>
                                <input type="datetime-local"
                                       id="dataHoraLliurament"
                                       name="dataHoraLliurament"
                                       th:value="${ara}"
                                       required>
                            </div>

                            <!-- Subida de fotos de desperfectos -->
                            <div class="form-group">
                                <label for="fotos">Fotografies de desperfectes (opcional, selecció múltiple)</label>
                                <input type="file"
                                       id="fotos"
                                       name="fotos"
                                       accept="image/*"
                                       multiple>
                                <small style="color: #666; display: block; margin-top: 4px;">
                                    Si el client detecta algun desperfecte visual, adjunta les fotos corresponents.
                                </small>
                            </div>

                            <!-- Descripción del estado en que se entrega el vehículo -->
                            <div class="form-group" style="grid-column: span 2;">
                                <label for="descripcioLliurament">Descripció de l'estat del vehicle en el lliurament <span style="color: red;">*</span></label>
                                <textarea id="descripcioLliurament"
                                          name="descripcioLliurament"
                                          rows="4"
                                          maxlength="1000"
                                          style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-family: inherit;"
                                          placeholder="Anota el nivell de combustible, quilometratge actual, neteja i si hi ha cap ratllada o desperfecte observat amb el client..."
                                          required></textarea>
                            </div>

                        </div>

                        <div class="button-group" style="margin-top: 24px;">
                            <button type="submit"
                                    class="btn btn-add"
                                    onclick="return confirm('Confirmes que el client ha verificat el vehicle i que el lliurament és correcte?');">
                                Confirmar Lliurament Correcte
                            </button>

                            <a th:href="@{__${session.rutaBase}__/reserves/lliurar}" class="btn btn-cancel">
                                Cancel·lar
                            </a>
                        </div>

                    </form>
                </div>

            </main>
        </div>

    </body>
</html>
